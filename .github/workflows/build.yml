name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate Android project structure
        run: |
          flutter create . --platforms=android --org com.yrs9.ps4installer
          
      - name: Configure Android SDK versions
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle
          sed -i 's/targetSdk = .*/targetSdk = 34/' android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Installer-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
